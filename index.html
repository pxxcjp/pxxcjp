let filter='all',query='',L=document.querySelector('#list'),T=document.querySelector('#toast');function pass(x){if(filter==='all')return true;if(filter==='received')return ['received','forwarded','aianswer','answering'].includes(x[4]);if(filter==='blocked')return x[4]==='blocked'||['risk','warn'].includes(x[7]);return x[4]===filter}function say(s){T.textContent=s;T.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>T.classList.remove('on'),1500)}
const actionIcons={call:'<svg viewBox="0 0 24 24"><path d="M7.2 3.5c.45-.22.98-.06 1.24.37l2.05 3.42c.23.38.17.86-.14 1.18L8.7 10.12a15.6 15.6 0 0 0 5.18 5.18l1.65-1.65c.32-.31.8-.37 1.18-.14l3.42 2.05c.43.26.59.79.37 1.24l-1.08 2.16c-.3.6-.9.98-1.57.98C10.2 19.94 4.06 13.8 4.06 6.15c0-.67.38-1.28.98-1.57L7.2 3.5z"/></svg>',msg:'<svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4.1 3.1A.55.55 0 0 1 4 19.65V6a2 2 0 0 1 2-2z"/></svg>',video:'<svg viewBox="0 0 24 24"><path d="M5 6h9a2 2 0 0 1 2 2v1.4l3.45-2.16A1 1 0 0 1 21 8.09v7.82a1 1 0 0 1-1.55.85L16 14.6V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>',info:'<svg viewBox="0 0 24 24"><path d="M12 2.75A9.25 9.25 0 1 0 12 21.25 9.25 9.25 0 0 0 12 2.75zm0 4.1a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm1.1 10.3h-2.2v-6.4h2.2v6.4z"/></svg>'};
function render(){let groups=new Map;calls.filter(x=>pass(x)&&(!query||x.join(' ').toLowerCase().includes(query))).forEach(x=>{if(!groups.has(x[0]))groups.set(x[0],[]);groups.get(x[0]).push(x)});L.innerHTML=[...groups].map(([d,a])=>`<div class="group"><div class="date">${d}</div><div class="card">${a.map(x=>`<article class="item"><div class="lane"><div class="call">${laneIcons.call}<span>呼叫</span></div><div class="msg"><span>信息</span>${laneIcons.msg}</div></div><div class="row"><div class="type">${typeIcons[x[4]]||typeIcons.received}</div><div class="copy"><div class="name ${x[4]==='missed'?'missed':''}"><span class="nm">${x[1]}</span>${x[8]>1?`<span class="count">(${x[8]})</span>`:''}</div><div class="sub"><span class="num">${x[2]}</span>${status(x[4])?`<span>·</span><span class="status ${x[4]}">${status(x[4])}</span>`:''}${x[6]?`<span class="tag ${x[7]}">${x[6]}</span>`:''}</div></div><div class="side">${x[3]}${note(x)}</div></div><div class="detail"><div class="meta"><b>${x[5]}</b><br>${x[2]}<br>${d} ${x[3]}${x[8]>1?`<br>连续 ${x[8]} 次通话记录`:''}</div><div class="actions"><button class="act"><span class="circle callc">${actionIcons.call}</span>呼叫</button><button class="act"><span class="circle msgc">${actionIcons.msg}</span>信息</button><button class="act"><span class="circle videoc">${actionIcons.video}</span>视频</button><button class="act"><span class="circle infoc">${actionIcons.info}</span>详情</button></div></div></article>`).join('')}</div></div>`).join('');bind();syncFastThumb()}
function bind(){document.querySelectorAll('.item').forEach(item=>{let row=item.querySelector('.row'),sx=0,sy=0,dx=0,active=false,drag=false,h=false;row.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;active=true;drag=h=false;dx=0;sx=e.clientX;sy=e.clientY;row.setPointerCapture?.(e.pointerId)};row.onpointermove=e=>{if(!active)return;let mx=e.clientX-sx,my=e.clientY-sy;if(!h&&Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.25){h=true;item.classList.add('swiping')}if(!h)return;drag=true;dx=Math.max(-92,Math.min(92,mx));row.style.transition='none';row.style.transform=`translateX(${dx}px)`};let end=()=>{if(!active)return;active=false;row.style.transition='';row.style.transform='';if(h&&Math.abs(dx)>62)say(dx>0?'演示：呼叫':'演示：信息');setTimeout(()=>item.classList.remove('swiping'),220);setTimeout(()=>{drag=h=false},0)};row.onpointerup=end;row.onpointercancel=end;row.onclick=()=>{if(!drag&&!h){document.querySelectorAll('.item.open').forEach(x=>x!==item&&x.classList.remove('open'));item.classList.toggle('open')}}})}
const norm=d=>{let m=d.match(/^(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日/);return m?`${m[1]||2026}年${+m[2]}月${+m[3]}日`:d.replace(/[,，].*$/,'')};let fast=false,st=0;function visibleDate(){let gs=[...L.querySelectorAll('.group')],y=L.scrollTop+8,g=gs[0];for(let x of gs){if(x.offsetTop<=y)g=x;else break}return g?norm(g.querySelector('.date').textContent):''}function syncFastThumb(){let t=fastTrack,b=fastThumb,max=L.scrollHeight-L.clientHeight,span=Math.max(1,t.clientHeight-b.offsetHeight);b.style.transform=`translateY(${(max>0?L.scrollTop/max:0)*span}px)`}function showDate(){if(fast)return;let d=visibleDate();if(!d)return;scrollDate.textContent=d;scrollDate.classList.add('on');clearTimeout(st);st=setTimeout(()=>scrollDate.classList.remove('on'),650)}function moveFast(e){let r=fastTrack.getBoundingClientRect(),th=fastThumb.offsetHeight,span=Math.max(1,r.height-th),y=Math.max(0,Math.min(span,e.clientY-r.top-th/2)),ratio=y/span;L.scrollTop=ratio*Math.max(0,L.scrollHeight-L.clientHeight);fastThumb.style.transform=`translateY(${y}px)`;fastLabel.textContent=visibleDate();fastLabel.style.top=`${r.top+y+th/2}px`;fastLabel.classList.add('on')}fastTrack.onpointerdown=e=>{fast=true;fastTrack.classList.add('dragging');fastTrack.setPointerCapture?.(e.pointerId);moveFast(e)};fastTrack.onpointermove=e=>{if(fast)moveFast(e)};fastTrack.onpointerup=fastTrack.onpointercancel=()=>{fast=false;fastTrack.classList.remove('dragging');fastLabel.classList.remove('on');syncFastThumb()};L.addEventListener('scroll',()=>{syncFastThumb();showDate()},{passive:true});
searchBtn.onclick=()=>{search.classList.add('on');tools.style.display='none';title.style.display='none';q.focus()};back.onclick=()=>{search.classList.remove('on');tools.style.display='';title.style.display='';q.value='';query='';render()};clear.onclick=()=>{q.value='';query='';render()};q.oninput=()=>{query=q.value.trim().toLowerCase();render()};filterBtn.onclick=()=>sheet.classList.add('on');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('sel',x===b));sheet.classList.remove('on');render();L.scrollTop=0});render();
</script></body></html>
