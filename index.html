<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>三星电话 · 最近记录交互演示</title>
<style>
:root{font-family:SamsungOne,"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;color-scheme:dark;--bg:#000;--row:#1c1c1f;--rowDown:#29292d;--text:#f4f4f6;--sub:#a3a3a7;--line:#39393d;--green:#11a85f;--blue:#6e8fff;--red:#e93b0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#000}body{display:grid;place-items:center;color:var(--text)}button,input{font:inherit;color:inherit}.phone{position:relative;width:min(430px,100vw);height:100dvh;overflow:hidden;background:#000}.appbar{height:69px;position:relative;background:#000}.title{position:absolute;left:26px;top:25px;font-size:22px;line-height:30px}.tools{position:absolute;right:15px;top:21px;display:flex}.tool{width:38px;height:38px;border:0;border-radius:20px;background:none;display:grid;place-items:center;cursor:pointer}.tool:active{background:#ffffff1f}.tool svg{width:23px;height:23px;fill:#f3f3f5}.search{position:absolute;left:14px;right:14px;top:18px;height:48px;border-radius:25px;background:#202023;display:none;align-items:center;padding:0 8px}.search.on{display:flex}.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px}.list{position:absolute;inset:69px 0 0;overflow-y:auto;overflow-x:hidden;padding:0 10px calc(72px + env(safe-area-inset-bottom));scrollbar-width:none;touch-action:pan-y}.list::-webkit-scrollbar{display:none}.group{margin-bottom:11px}.date{padding:4px 18px 5px;color:#9e9ea4;font-size:13px;line-height:18px;font-weight:650;background:#000}.card{overflow:hidden;border-radius:26px;background:var(--row)}.item{position:relative;overflow:hidden}.item+.item:before{content:"";position:absolute;z-index:5;left:18px;right:18px;top:0;height:1px;background:var(--line)}.lane{position:absolute;inset:0 0 auto;height:58px;display:flex;justify-content:space-between;opacity:0;visibility:hidden}.item.swiping .lane{opacity:1;visibility:visible}.lane div{width:92px;display:flex;align-items:center;gap:6px;padding:0 13px;color:#fff;font-size:12px}.lane .call{background:#00aa68}.lane .msg{background:#6e8fff;justify-content:flex-end;margin-left:auto}.row{position:relative;z-index:2;min-height:58px;display:grid;grid-template-columns:17px minmax(0,1fr) auto;align-items:center;column-gap:15px;padding:7px 18px;background:var(--row);cursor:pointer;user-select:none;touch-action:pan-y;transition:transform .22s cubic-bezier(.2,0,0,1),background .16s}.row:active{background:var(--rowDown)}.type{font-size:17px;text-align:center}.copy{min-width:0}.name{display:flex;align-items:center;min-width:0;font-size:17px;line-height:21px}.name.missed{color:var(--red)}.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.count{font-size:14px}.sub{display:flex;align-items:center;min-width:0;gap:4px;color:var(--sub);font-size:13px;line-height:17px}.num{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{white-space:nowrap}.tag{white-space:nowrap}.tag.risk{color:#fc654d}.tag.warn{color:#ff9b48}.tag.ok{color:#63b38a}.side{min-width:126px;text-align:right;color:var(--sub);font-size:13px}.note{font-size:10px;margin-top:1px}.detail{max-height:0;overflow:hidden;opacity:0;background:var(--row);transition:max-height .3s cubic-bezier(.2,0,0,1),opacity .16s}.item.open .detail{max-height:164px;opacity:1}.meta{padding:10px 18px 5px;color:#aaaab0;font-size:11px;line-height:16px;border-top:1px solid var(--line)}.actions{display:flex;justify-content:space-around;padding:6px 14px 12px}.act{border:0;background:none;color:#b5b5ba;font-size:10px;display:grid;justify-items:center;gap:5px;min-width:58px;cursor:pointer}.act:active .circle{transform:scale(.92);filter:brightness(1.12)}.circle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:transform .12s,filter .12s;box-shadow:inset 0 0 0 1px #ffffff0f}.circle svg{width:21px;height:21px;fill:#fff}.circle.callc{background:#18a86b}.circle.msgc{background:#4f7df3}.circle.videoc{background:#8a67d8}.circle.infoc{background:#5f6b7d}.bottom{position:absolute;z-index:30;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(272px,calc(100vw - 50px));height:51px;padding:3px;border-radius:28px;background:#232326f5;display:grid;grid-template-columns:repeat(4,1fr);backdrop-filter:blur(16px)}.tab{border:0;background:none;border-radius:24px;color:#f0f0f2;font-size:9px;display:grid;place-items:center;align-content:center;gap:1px}.tab.sel{background:#3a3a3e;font-weight:650}.tab b{font-size:18px;font-weight:400}.toast{position:absolute;z-index:80;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#37373bf5;padding:10px 16px;border-radius:20px;font-size:12px;white-space:nowrap;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}.sheet{position:absolute;z-index:60;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));background:#28282c;border-radius:28px;padding:16px;transform:translateY(120%);transition:.25s}.sheet.on{transform:none}.sheet h2{margin:0 8px 10px;font-size:19px}.filter{width:100%;height:46px;border:0;border-radius:14px;background:none;text-align:left;padding:0 10px}.filter.sel{background:#ffffff12}.empty{padding:80px 20px;text-align:center;color:#777;display:none}@media(max-width:360px){.side{min-width:105px}.row{column-gap:10px;padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<main class="phone">
<header class="appbar"><div class="title" id="title">电话</div><div class="tools" id="tools"><button class="tool" id="filterBtn" aria-label="筛选"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm3 6h10v2H7zm3 6h4v2h-4z"/></svg></button><button class="tool" id="searchBtn" aria-label="搜索"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 1 0 4.7 13.35L20 21l1-1-4.65-4.8A7.5 7.5 0 0 0 10.5 3m0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11"/></svg></button></div><div class="search" id="search"><button class="tool" id="back">←</button><input id="q" placeholder="搜索联系人和号码"><button class="tool" id="clear">×</button></div></header>
<section class="list" id="list"></section>
<nav class="bottom"><button class="tab"><b>⠿</b><span>拨号盘</span></button><button class="tab sel"><b>☎</b><span>最近记录</span></button><button class="tab"><b>♙</b><span>联系人</span></button><button class="tab"><b>▣</b><span>黄页</span></button></nav>
<section class="sheet" id="sheet"><h2>要显示的通话</h2><button class="filter sel" data-f="all">所有通话</button><button class="filter" data-f="missed">未接来电</button><button class="filter" data-f="received">已接来电</button><button class="filter" data-f="sent">已拨电话</button><button class="filter" data-f="blocked">阻止/骚扰电话</button></section>
<div class="toast" id="toast"></div>
</main>
<script>
const raw=[
['1月3日, 星期六','周宁','江西赣州　移动','下午3:27, 4 分 51 秒','sent','去电 · 通话 4 分 51 秒','',''],
['1月3日, 星期六','北岸物流','河北廊坊','下午1:23, 0 分 37 秒','received','来电 · 通话 37 秒','快递送餐','ok'],
['1月3日, 星期六','许澄','江西赣州　移动','上午11:46','missed','未接来电','',''],
['1月3日, 星期六','未知号码','广东广州','上午9:18','blocked','已阻止的来电','骚扰电话','risk'],
['1月2日, 星期五','林川','江西赣州　移动','下午8:41, 2 分 06 秒','received','来电 · 通话 2 分 06 秒','',''],
['1月2日, 星期五','江屿','江西赣州　移动','下午6:25','declined','已拒绝的来电','',''],
['1月2日, 星期五','客服热线','上海','上午10:12','unanswered','未接通','',''],
['1月1日, 星期四','沈知遥','江西赣州　移动','下午4:33, 0 分 52 秒','sent','去电 · 通话 52 秒','',''],
['1月1日, 星期四','青禾服务','智能语音回复','下午2:57, 0 分 24 秒','received','来电 · 智能语音回复 24 秒','自动','ok'],
['1月1日, 星期四','陆言','江西赣州　移动','下午2:54, 1 分 11 秒','forwarded','已转接来电 · 通话 1 分 11 秒','',''],
['1月1日, 星期四','星河商贸','北京','下午2:14','blocked','已阻止的来电','广告','warn'],
['2025年12月31日星期三','陈屿','江西赣州　移动','下午9:12, 3 分 18 秒','received','来电 · 通话 3 分 18 秒','',''],
['2025年12月31日星期三','家里','江西赣州　移动','下午7:40, 0 分 46 秒','sent','去电 · 通话 46 秒','',''],
['2025年12月31日星期三','未知号码','浙江杭州','下午3:09','missed','未接来电','疑似推销','warn'],
['2025年12月30日星期二','苏芮','江西赣州　移动','下午8:05, 1 分 21 秒','received','来电 · 通话 1 分 21 秒','',''],
['2025年12月30日星期二','银行客服','官方客服','下午2:22, 2 分 07 秒','received','来电 · 通话 2 分 07 秒','已验证的来电者','ok'],
['2025年12月30日星期二','陌生号码','江苏南京','上午10:36','blocked','已阻止的来电','可疑骚扰电话','risk'],
['2025年12月29日星期一','赵闻','江西赣州　移动','下午9:30','missed','未接来电','',''],
['2025年12月29日星期一','外卖骑手','江西赣州','下午6:48, 0 分 19 秒','received','来电 · 通话 19 秒','快递送餐','ok'],
['2025年12月29日星期一','顾言','江西赣州　移动','上午11:13, 5 分 04 秒','sent','去电 · 通话 5 分 04 秒','',''],
['2025年12月28日星期日','周宁','江西赣州　移动','下午7:52, 1 分 05 秒','received','来电 · 通话 1 分 05 秒','',''],
['2025年12月28日星期日','市场调研','北京','下午4:03','declined','已拒绝的来电','广告','warn'],
['2025年12月27日星期六','林川','江西赣州　移动','下午10:17, 2 分 31 秒','sent','去电 · 通话 2 分 31 秒','',''],
['2025年12月27日星期六','可疑来电','境外号码','下午5:42','missed','未接来电','可疑诈骗电话','risk'],
['2025年12月27日星期六','智能客服','智能语音回复','上午11:06, 0 分 32 秒','received','来电 · 智能语音回复 32 秒','自动','ok'],
['2025年12月26日星期五','北城物业','江西赣州','下午8:19, 0 分 47 秒','forwarded','已转接来电 · 通话 47 秒','',''],
['2025年12月26日星期五','票务平台','上海','下午3:24, 2 分 14 秒','received','来电 · 通话 2 分 14 秒','已验证的来电者','ok'],
['2025年12月26日星期五','未知号码','四川成都','上午9:16','blocked','已阻止的来电','可疑骚扰电话','risk'],
['2025年12月24日星期三','陆宁','江西赣州　移动','下午6:08, 0 分 58 秒','sent','去电 · 通话 58 秒','',''],
['2025年12月24日星期三','公共服务热线','政务服务','上午10:05, 3 分 36 秒','received','来电 · 通话 3 分 36 秒','已验证的来电者','ok']];
let filter='all',query='';const L=document.querySelector('#list'),T=document.querySelector('#toast');const icon=k=>({sent:'↗',received:'↙',missed:'↘',declined:'⊘',blocked:'⊘',unanswered:'!',forwarded:'↻'}[k]||'↙');const status=k=>({missed:'未接来电',declined:'已拒绝的来电',blocked:'已阻止的来电',unanswered:'未接通',forwarded:'已转接来电'}[k]||'');
const actionIcons={call:'<svg viewBox="0 0 24 24"><path d="M7.2 3.5c.45-.22.98-.06 1.24.37l2.05 3.42c.23.38.17.86-.14 1.18L8.7 10.12a15.6 15.6 0 0 0 5.18 5.18l1.65-1.65c.32-.31.8-.37 1.18-.14l3.42 2.05c.43.26.59.79.37 1.24l-1.08 2.16c-.3.6-.9.98-1.57.98C10.2 19.94 4.06 13.8 4.06 6.15c0-.67.38-1.28.98-1.57L7.2 3.5z"/></svg>',msg:'<svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4.1 3.1A.55.55 0 0 1 4 19.65V6a2 2 0 0 1 2-2zm2.2 5.2h9.6a1 1 0 1 0 0-2H7.2a1 1 0 1 0 0 2zm0 4h6.5a1 1 0 1 0 0-2H7.2a1 1 0 1 0 0 2z"/></svg>',video:'<svg viewBox="0 0 24 24"><path d="M5 6h9a2 2 0 0 1 2 2v1.4l3.45-2.16A1 1 0 0 1 21 8.09v7.82a1 1 0 0 1-1.55.85L16 14.6V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>',info:'<svg viewBox="0 0 24 24"><path d="M12 2.75A9.25 9.25 0 1 0 12 21.25 9.25 9.25 0 0 0 12 2.75zm0 4.1a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm1.1 10.3h-2.2v-6.4h2.2v6.4z"/></svg>'};
function say(s){T.textContent=s;T.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>T.classList.remove('on'),1600)}
function pass(x){if(filter==='all')return true;if(filter==='received')return ['received','forwarded'].includes(x[4]);if(filter==='blocked')return ['blocked'].includes(x[4])||['risk','warn'].includes(x[7]);return x[4]===filter}
function render(){const groups=new Map;raw.filter(x=>pass(x)&&(!query||x.join(' ').toLowerCase().includes(query))).forEach(x=>{if(!groups.has(x[0]))groups.set(x[0],[]);groups.get(x[0]).push(x)});L.innerHTML=[...groups].map(([d,a])=>`<div class="group"><div class="date">${d}</div><div class="card">${a.map((x,i)=>`<article class="item"><div class="lane"><div class="call">☎ 呼叫</div><div class="msg">信息 ✉</div></div><div class="row" tabindex="0"><div class="type" style="color:${x[4]==='missed'?'#e93b0c':x[4]==='sent'?'#11a85f':'#9b9ba1'}">${icon(x[4])}</div><div class="copy"><div class="name ${x[4]==='missed'?'missed':''}"><span class="nm">${x[1]}</span></div><div class="sub"><span class="num">${x[2]}</span>${status(x[4])?`<span>·</span><span class="status">${status(x[4])}</span>`:''}${x[6]?`<span class="tag ${x[7]}">${x[6]}</span>`:''}</div></div><div class="side">${x[3]}${x[5].includes('通话')?'<div class="note">● 录音/详情</div>':''}</div></div><div class="detail"><div class="meta"><b>${x[5]}</b><br>${x[2]}<br>${d} ${x[3]}</div><div class="actions"><button class="act"><span class="circle callc">${actionIcons.call}</span>呼叫</button><button class="act"><span class="circle msgc">${actionIcons.msg}</span>信息</button><button class="act"><span class="circle videoc">${actionIcons.video}</span>视频</button><button class="act"><span class="circle infoc">${actionIcons.info}</span>详情</button></div></div></article>`).join('')}</div></div>`).join('')||'<div class="empty" style="display:block">未找到匹配的通话记录</div>';bind()}
function bind(){document.querySelectorAll('.item').forEach(item=>{const row=item.querySelector('.row');let sx=0,sy=0,dx=0,active=false,drag=false,h=false;row.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;active=true;drag=false;h=false;dx=0;sx=e.clientX;sy=e.clientY;item.classList.remove('swiping');row.setPointerCapture?.(e.pointerId)};row.onpointermove=e=>{if(!active)return;const mx=e.clientX-sx,my=e.clientY-sy;if(!h&&Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.25){h=true;item.classList.add('swiping')}if(!h)return;drag=true;dx=Math.max(-92,Math.min(92,mx));row.style.transition='none';row.style.transform=`translateX(${dx}px)`};const end=()=>{if(!active)return;active=false;row.style.transition='';row.style.transform='';if(h&&Math.abs(dx)>62)say(dx>0?'演示：呼叫已拦截，不会真正拨号':'演示：信息已拦截，不会打开短信');setTimeout(()=>item.classList.remove('swiping'),220);setTimeout(()=>{drag=false;h=false},0)};row.onpointerup=end;row.onpointercancel=end;row.onclick=()=>{if(!drag&&!h){document.querySelectorAll('.item.open').forEach(x=>x!==item&&x.classList.remove('open'));item.classList.toggle('open')}};row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();item.classList.toggle('open')}}})}
searchBtn.onclick=()=>{search.classList.add('on');tools.style.display='none';title.style.display='none';q.focus()};back.onclick=()=>{search.classList.remove('on');tools.style.display='';title.style.display='';q.value='';query='';render()};clear.onclick=()=>{q.value='';query='';render();q.focus()};q.oninput=()=>{query=q.value.trim().toLowerCase();render()};filterBtn.onclick=()=>sheet.classList.add('on');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('sel',x===b));sheet.classList.remove('on');render();L.scrollTop=0;say('已更新筛选')});document.querySelectorAll('.tab:not(.sel)').forEach(b=>b.onclick=()=>say('演示页面仅还原最近记录入口'));render();
</script>
</body>
</html>
