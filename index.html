let fastDragging=false,scrollDateTimer=0;function visibleDate(){const gs=[...L.querySelectorAll('.group')];if(!gs.length)return '';const y=L.scrollTop+8;let g=gs[0];for(const x of gs){if(x.offsetTop<=y)g=x;else break}return normalizeDateLabel(g.querySelector('.date')?.textContent||'')}function syncFastThumb(){const track=document.querySelector('#fastTrack'),thumb=document.querySelector('#fastThumb');if(!track||!thumb)return;const max=L.scrollHeight-L.clientHeight,span=Math.max(1,track.clientHeight-thumb.offsetHeight);const r=max>0?L.scrollTop/max:0;thumb.style.transform=`translateY(${r*span}px)`}function showScrollDate(){if(fastDragging)return;const el=document.querySelector('#scrollDate'),d=visibleDate();if(!d)return;el.textContent=d;el.classList.add('on');clearTimeout(scrollDateTimer);scrollDateTimer=setTimeout(()=>el.classList.remove('on'),650)}function bindFastScroller(){const track=document.querySelector('#fastTrack'),thumb=document.querySelector('#fastThumb'),label=document.querySelector('#fastLabel');if(!track||track.dataset.bound)return;track.dataset.bound='1';const move=e=>{const r=track.getBoundingClientRect(),th=thumb.offsetHeight,span=Math.max(1,r.height-th),y=Math.max(0,Math.min(span,e.clientY-r.top-th/2)),ratio=y/span;L.scrollTop=ratio*Math.max(0,L.scrollHeight-L.clientHeight);thumb.style.transform=`translateY(${y}px)`;label.textContent=visibleDate();label.style.top=`${r.top+y+th/2}px`;label.classList.add('on')};track.onpointerdown=e=>{fastDragging=true;track.classList.add('dragging');track.setPointerCapture?.(e.pointerId);move(e)};track.onpointermove=e=>{if(fastDragging)move(e)};const end=()=>{if(!fastDragging)return;fastDragging=false;track.classList.remove('dragging');label.classList.remove('on');syncFastThumb()};track.onpointerup=end;track.onpointercancel=end;L.addEventListener('scroll',()=>{syncFastThumb();showScrollDate()},{passive:true});window.addEventListener('resize',syncFastThumb);syncFastThumb()}
const actionIcons={call:'<svg viewBox="0 0 24 24"><path d="M7.2 3.5c.45-.22.98-.06 1.24.37l2.05 3.42c.23.38.17.86-.14 1.18L8.7 10.12a15.6 15.6 0 0 0 5.18 5.18l1.65-1.65c.32-.31.8-.37 1.18-.14l3.42 2.05c.43.26.59.79.37 1.24l-1.08 2.16c-.3.6-.9.98-1.57.98C10.2 19.94 4.06 13.8 4.06 6.15c0-.67.38-1.28.98-1.57L7.2 3.5z"/></svg>',msg:'<svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4.1 3.1A.55.55 0 0 1 4 19.65V6a2 2 0 0 1 2-2zm2.2 5.2h9.6a1 1 0 1 0 0-2H7.2a1 1 0 1 0 0 2zm0 4h6.5a1 1 0 1 0 0-2H7.2a1 1 0 1 0 0 2z"/></svg>',video:'<svg viewBox="0 0 24 24"><path d="M5 6h9a2 2 0 0 1 2 2v1.4l3.45-2.16A1 1 0 0 1 21 8.09v7.82a1 1 0 0 1-1.55.85L16 14.6V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>',info:'<svg viewBox="0 0 24 24"><path d="M12 2.75A9.25 9.25 0 1 0 12 21.25 9.25 9.25 0 0 0 12 2.75zm0 4.1a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm1.1 10.3h-2.2v-6.4h2.2v6.4z"/></svg>'};
function say(s){T.textContent=s;T.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>T.classList.remove('on'),1600)}
function pass(x){if(filter==='all')return true;if(filter==='received')return ['received','forwarded'].includes(x[4]);if(filter==='blocked')return ['blocked'].includes(x[4])||['risk','warn'].includes(x[7]);return x[4]===filter}
function render(){const groups=new Map;raw.filter(x=>pass(x)&&(!query||x.join(' ').toLowerCase().includes(query))).forEach(x=>{if(!groups.has(x[0]))groups.set(x[0],[]);groups.get(x[0]).push(x)});L.innerHTML=[...groups].map(([d,a])=>`<div class="group"><div class="date">${d}</div><div class="card">${a.map((x,i)=>`<article class="item"><div class="lane"><div class="call">${laneIcons.call}<span>呼叫</span></div><div class="msg"><span>信息</span>${laneIcons.msg}</div></div><div class="row" tabindex="0"><div class="type" style="color:${x[4]==='missed'?'#e93b0c':x[4]==='sent'?'#11a85f':'#9b9ba1'}">${icon(x[4])}</div><div class="copy"><div class="name ${x[4]==='missed'?'missed':''}"><span class="nm">${x[1]}</span></div><div class="sub"><span class="num">${x[2]}</span>${status(x[4])?`<span>·</span><span class="status">${status(x[4])}</span>`:''}${x[6]?`<span class="tag ${x[7]}">${x[6]}</span>`:''}</div></div><div class="side">${x[3]}${rowNote(x)}</div></div><div class="detail"><div class="meta"><b>${x[5]}</b><br>${x[2]}<br>${d} ${x[3]}</div><div class="actions"><button class="act"><span class="circle callc">${actionIcons.call}</span>呼叫</button><button class="act"><span class="circle msgc">${actionIcons.msg}</span>信息</button><button class="act"><span class="circle videoc">${actionIcons.video}</span>视频</button><button class="act"><span class="circle infoc">${actionIcons.info}</span>详情</button></div></div></article>`).join('')}</div></div>`).join('')||'<div class="empty" style="display:block">未找到匹配的通话记录</div>';bind()}
function bind(){document.querySelectorAll('.item').forEach(item=>{const row=item.querySelector('.row');let sx=0,sy=0,dx=0,active=false,drag=false,h=false;row.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;active=true;drag=false;h=false;dx=0;sx=e.clientX;sy=e.clientY;item.classList.remove('swiping');row.setPointerCapture?.(e.pointerId)};row.onpointermove=e=>{if(!active)return;const mx=e.clientX-sx,my=e.clientY-sy;if(!h&&Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)*1.25){h=true;item.classList.add('swiping')}if(!h)return;drag=true;dx=Math.max(-92,Math.min(92,mx));row.style.transition='none';row.style.transform=`translateX(${dx}px)`};const end=()=>{if(!active)return;active=false;row.style.transition='';row.style.transform='';if(h&&Math.abs(dx)>62)say(dx>0?'演示：呼叫已拦截，不会真正拨号':'演示：信息已拦截，不会打开短信');setTimeout(()=>item.classList.remove('swiping'),220);setTimeout(()=>{drag=false;h=false},0)};row.onpointerup=end;row.onpointercancel=end;row.onclick=()=>{if(!drag&&!h){document.querySelectorAll('.item.open').forEach(x=>x!==item&&x.classList.remove('open'));item.classList.toggle('open')}};row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();item.classList.toggle('open')}}})}
searchBtn.onclick=()=>{search.classList.add('on');tools.style.display='none';title.style.display='none';q.focus()};back.onclick=()=>{search.classList.remove('on');tools.style.display='';title.style.display='';q.value='';query='';render()};clear.onclick=()=>{q.value='';query='';render();q.focus()};q.oninput=()=>{query=q.value.trim().toLowerCase();render()};filterBtn.onclick=()=>sheet.classList.add('on');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('sel',x===b));sheet.classList.remove('on');render();L.scrollTop=0;say('已更新筛选')});document.querySelectorAll('.tab:not(.sel)').forEach(b=>b.onclick=()=>say('演示页面仅还原最近记录入口'));render();
setTimeout(bindFastScroller,0);
</script>
