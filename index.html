<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三星电话 · 最近记录交互演示</title><style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.msg{opacity:.7;font-size:14px}</style><div class="msg" id="msg">正在加载演示页面…</div><script>(async()=>{try{const t=(await fetch('./payload.gz.b64',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+r.status);return r.text()})).trim();const bin=Uint8Array.from(atob(t),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('browser does not support gzip decompression');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('msg').textContent='页面加载失败：'+e.message}})();</script>
