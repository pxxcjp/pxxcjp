name: Patch call log scroll
on:
  push:
    paths: ['.scroll-patch-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace(".lane div{width:92px;display:flex;align-items:center;gap:6px;padding:0 13px;color:#fff;font-size:12px}",".lane div{width:92px;display:flex;align-items:center;gap:6px;padding:0 13px;color:#fff;font-size:12px}.lane svg{width:23px;height:23px;fill:#fff;flex:none}.side{position:relative}.note{display:flex;justify-content:flex-end;align-items:center;height:16px;margin-top:1px;color:#9b9ba1}.note svg{width:15px;height:15px;fill:currentColor}.fast-track{position:absolute;z-index:42;right:2px;top:88px;bottom:78px;width:14px;touch-action:none}.fast-thumb{position:absolute;right:3px;top:0;width:4px;height:42px;border-radius:3px;background:#74747a;opacity:.9}.fast-track.dragging .fast-thumb{width:5px;background:#9a9aa0}.fast-label{position:absolute;z-index:43;right:20px;min-width:108px;height:34px;padding:0 12px;border-radius:17px;background:#4169e1;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:650;white-space:nowrap;pointer-events:none;transform:translateY(-50%);box-shadow:0 3px 12px #0008}.fast-label.on{display:flex}.scroll-date{position:absolute;z-index:41;top:82px;left:50%;transform:translate(-50%,-8px);padding:7px 12px;border-radius:16px;background:#4a4a4ee8;color:#fff;font-size:12px;font-weight:650;white-space:nowrap;opacity:0;pointer-events:none;transition:.16s}.scroll-date.on{opacity:1;transform:translate(-50%,0)}")
          s=s.replace("<section class=\"list\" id=\"list\"></section>","<section class=\"list\" id=\"list\"></section><div class=\"fast-track\" id=\"fastTrack\"><div class=\"fast-thumb\" id=\"fastThumb\"></div></div><div class=\"fast-label\" id=\"fastLabel\"></div><div class=\"scroll-date\" id=\"scrollDate\"></div>")
          old="const icon=k=>({sent:'↗',received:'↙',missed:'↘',declined:'⊘',blocked:'⊘',unanswered:'!',forwarded:'↻'}[k]||'↙');"
          new="const icon=k=>({sent:'↗',received:'↙',missed:'↙',declined:'↙',blocked:'↙',unanswered:'↙',forwarded:'↙'}[k]||'↙');"
          s=s.replace(old,new)
          marker="];\nlet filter='all',query='';"
          insert="];\nconst extraNames=['顾行宇','陈砚','宋安','赵闻','苏芮','林川','沈知遥','陆言','许澄','周宁','江鸣','北岸物流','青禾服务','外卖骑手','银行客服'];\nconst extraPlaces=['江西赣州　移动','广东广州','上海','北京','浙江杭州','江苏南京','四川成都','河北廊坊'];\nconst extraKinds=['received','sent','received','missed','declined','received','sent','blocked','forwarded'];\nconst wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];\nlet cursor=new Date(2025,11,23),seed=0;while(raw.length<100){const day=new Date(cursor);const per=2+(seed%3);for(let j=0;j<per&&raw.length<100;j++){const k=extraKinds[(seed+j)%extraKinds.length],name=extraNames[(seed*3+j)%extraNames.length],place=extraPlaces[(seed+j*2)%extraPlaces.length];const hh=9+((seed*5+j*3)%13),mm=((seed*11+j*17)%60);const dur=k==='missed'||k==='declined'||k==='blocked'?'':`, ${j%3} 分 ${String((seed*7+j*13)%60).padStart(2,'0')} 秒`;const d=`${day.getFullYear()}年${day.getMonth()+1}月${day.getDate()}日${wd[day.getDay()]}`;const time=`${hh<12?'上午':'下午'}${hh>12?hh-12:hh}:${String(mm).padStart(2,'0')}${dur}`;const desc=k==='sent'?'去电':k==='missed'?'未接来电':k==='declined'?'已拒绝的来电':k==='blocked'?'已阻止的来电':k==='forwarded'?'已转接来电':'来电';raw.push([d,name,place,time,k,desc+(dur?` · 通话${dur.slice(1)}`:''),k==='blocked'?'可疑骚扰电话':'',k==='blocked'?'risk':'']);}cursor.setDate(cursor.getDate()-1);seed++;}\nlet filter='all',query='';"
          if marker not in s: raise SystemExit('raw marker not found')
          s=s.replace(marker,insert,1)
          needle="const rowNote=x=>x[5].includes('智能语音回复')?`<div class=\"note\" aria-label=\"智能语音回复\">${rowIcons.ai}</div>`:recordedNames.has(x[1])?`<div class=\"note\" aria-label=\"有通话录音\">${rowIcons.mic}</div>`:'';"
          add=needle+"\nconst normalizeDateLabel=d=>{const m=d.match(/^(?:(\\d{4})年)?(\\d{1,2})月(\\d{1,2})日/);return m?`${m[1]||2026}年${Number(m[2])}月${Number(m[3])}日`:d.replace(/[,，].*$/,'')};\nlet fastDragging=false,scrollDateTimer=0;function visibleDate(){const gs=[...L.querySelectorAll('.group')];if(!gs.length)return '';const y=L.scrollTop+8;let g=gs[0];for(const x of gs){if(x.offsetTop<=y)g=x;else break}return normalizeDateLabel(g.querySelector('.date')?.textContent||'')}function syncFastThumb(){const track=document.querySelector('#fastTrack'),thumb=document.querySelector('#fastThumb');if(!track||!thumb)return;const max=L.scrollHeight-L.clientHeight,span=Math.max(1,track.clientHeight-thumb.offsetHeight);const r=max>0?L.scrollTop/max:0;thumb.style.transform=`translateY(${r*span}px)`}function showScrollDate(){if(fastDragging)return;const el=document.querySelector('#scrollDate'),d=visibleDate();if(!d)return;el.textContent=d;el.classList.add('on');clearTimeout(scrollDateTimer);scrollDateTimer=setTimeout(()=>el.classList.remove('on'),650)}function bindFastScroller(){const track=document.querySelector('#fastTrack'),thumb=document.querySelector('#fastThumb'),label=document.querySelector('#fastLabel');if(!track||track.dataset.bound)return;track.dataset.bound='1';const move=e=>{const r=track.getBoundingClientRect(),th=thumb.offsetHeight,span=Math.max(1,r.height-th),y=Math.max(0,Math.min(span,e.clientY-r.top-th/2)),ratio=y/span;L.scrollTop=ratio*Math.max(0,L.scrollHeight-L.clientHeight);thumb.style.transform=`translateY(${y}px)`;label.textContent=visibleDate();label.style.top=`${r.top+y+th/2}px`;label.classList.add('on')};track.onpointerdown=e=>{fastDragging=true;track.classList.add('dragging');track.setPointerCapture?.(e.pointerId);move(e)};track.onpointermove=e=>{if(fastDragging)move(e)};const end=()=>{if(!fastDragging)return;fastDragging=false;track.classList.remove('dragging');label.classList.remove('on');syncFastThumb()};track.onpointerup=end;track.onpointercancel=end;L.addEventListener('scroll',()=>{syncFastThumb();showScrollDate()},{passive:true});window.addEventListener('resize',syncFastThumb);syncFastThumb()}"
          if needle not in s: raise SystemExit('rowNote marker not found')
          s=s.replace(needle,add,1)
          s=s.replace("</script>\n</body>","setTimeout(bindFastScroller,0);\n</script>\n</body>")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Expand call log and add date fast scroller'
          git push
