name: Patch fast label side
on:
  push:
    paths: ['.fast-label-swap-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch CSS
        run: |
          python - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          s=s.replace('.fast-label{position:absolute;z-index:43;right:20px;', '.fast-label{position:absolute;z-index:43;left:20px;')
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Swap fast label to left side' || exit 0
          git push
