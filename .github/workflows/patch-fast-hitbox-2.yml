name: Patch fast scroller hitbox again
on:
  push:
    paths: ['.fast-hitbox-trigger-2']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch CSS
        run: |
          python - <<'PY'
          p='index.html'
          s=open(p,encoding='utf-8').read()
          s=s.replace('.fast-track{position:absolute;z-index:42;right:2px;top:88px;bottom:78px;width:28px;touch-action:none}', '.fast-track{position:absolute;z-index:42;right:2px;top:88px;bottom:78px;width:56px;touch-action:none}')
          s=s.replace('.fast-label{position:absolute;z-index:43;right:34px;', '.fast-label{position:absolute;z-index:43;right:100px;')
          open(p,'w',encoding='utf-8').write(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Widen fast scroller hitbox and shift date label farther left' || exit 0
          git push
