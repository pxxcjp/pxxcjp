name: Patch fast scroller styles
on:
  push:
    paths: ['.scroll-css-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          css='.fast-track{position:absolute;z-index:42;right:2px;top:88px;bottom:78px;width:14px;touch-action:none}.fast-thumb{position:absolute;right:3px;top:0;width:4px;height:42px;border-radius:3px;background:#74747a;opacity:.9}.fast-track.dragging .fast-thumb{width:5px;background:#9a9aa0}.fast-label{position:absolute;z-index:43;right:20px;min-width:108px;height:34px;padding:0 12px;border-radius:17px;background:#4169e1;color:#fff;display:none;align-items:center;justify-content:center;font-size:12px;font-weight:650;white-space:nowrap;pointer-events:none;transform:translateY(-50%);box-shadow:0 3px 12px #0008}.fast-label.on{display:flex}.scroll-date{position:absolute;z-index:41;top:82px;left:50%;transform:translate(-50%,-8px);padding:7px 12px;border-radius:16px;background:#4a4a4ee8;color:#fff;font-size:12px;font-weight:650;white-space:nowrap;opacity:0;pointer-events:none;transition:.16s}.scroll-date.on{opacity:1;transform:translate(-50%,0)}'
          if '.fast-track{' not in s:
              s=s.replace('@media(max-width:360px)',css+'@media(max-width:360px)',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Style date fast scroller'
          git push
