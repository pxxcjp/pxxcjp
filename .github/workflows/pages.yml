name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify rawgithack CDN
        shell: bash
        run: |
          url="https://rawcdn.githack.com/pxxcjp/pxxcjp/$GITHUB_SHA/index.html"
          echo "Verifying $url"
          for i in {1..30}; do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if printf '%s' "$body" | grep -q '三星电话'; then
              printf 'verified\nurl=%s\ncommit=%s\n' "$url" "$GITHUB_SHA" > verified-cdn.txt
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Save CDN verification marker
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verified-cdn.txt
          git commit -m 'Verify CDN deployment [skip ci]' || exit 0
          git push
