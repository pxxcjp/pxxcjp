name: Restore and deploy direct HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore standalone index.html from repository payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip

          payload = Path('payload.gz.b64').read_text(encoding='utf-8').strip()
          html = gzip.decompress(base64.b64decode(payload)).decode('utf-8')

          # Mouse hover must never count as a swipe; left-button drag still does.
          html = html.replace(
              'let startX = 0, startY = 0, dx = 0, dragging = false, horizontal = false;',
              'let startX = 0, startY = 0, dx = 0, dragging = false, horizontal = false, pointerActive = false;'
          )
          html = html.replace(
              "row.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; dx = 0; dragging = false; horizontal = false; item.classList.remove('swiping'); row.setPointerCapture(e.pointerId); });",
              "row.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; pointerActive = true; startX = e.clientX; startY = e.clientY; dx = 0; dragging = false; horizontal = false; item.classList.remove('swiping'); row.setPointerCapture(e.pointerId); });"
          )
          html = html.replace(
              "row.addEventListener('pointermove', e => {\n          const moveX",
              "row.addEventListener('pointermove', e => {\n          if (!pointerActive) return;\n          const moveX"
          )
          html = html.replace(
              "const endDrag = () => {\n          row.style.transition",
              "const endDrag = () => {\n          if (!pointerActive) return;\n          pointerActive = false;\n          row.style.transition"
          )

          # Screenshot treatment: pure-black list background, dark-gray record blocks.
          html = html.replace('background: #17171a;', 'background: #1c1c1f;')

          if '<!doctype html>' not in html.lower() or '</html>' not in html.lower():
              raise SystemExit('restored HTML is incomplete')
          if 'DecompressionStream' in html or "const t='H4s" in html:
              raise SystemExit('restored HTML still contains wrapper loader')

          Path('index.html').write_text(html, encoding='utf-8')
          print('restored index.html bytes:', len(html.encode('utf-8')))
          PY

      - name: Commit restored direct file
        id: restore_commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f verified.txt verified-cdn.txt verified-direct.txt
          git add index.html
          git rm -f payload.gz.b64 || true
          git add -u
          git commit -m 'Restore direct standalone HTML [skip ci]'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed direct HTML
        shell: bash
        run: |
          page='${{ steps.deployment.outputs.page_url }}'
          cdn="https://rawcdn.githack.com/pxxcjp/pxxcjp/${{ steps.restore_commit.outputs.sha }}/index.html"
          ok_page=0
          ok_cdn=0
          for i in {1..30}; do
            body="$(curl -fsSL --max-time 20 "$page" || true)"
            if printf '%s' "$body" | grep -q '<html lang="zh-CN">' && printf '%s' "$body" | grep -q 'pointerActive'; then ok_page=1; break; fi
            sleep 10
          done
          for i in {1..30}; do
            body="$(curl -fsSL --max-time 20 "$cdn" || true)"
            if printf '%s' "$body" | grep -q '<html lang="zh-CN">' && printf '%s' "$body" | grep -q 'pointerActive'; then ok_cdn=1; break; fi
            sleep 10
          done
          test "$ok_page" = 1
          test "$ok_cdn" = 1
          printf 'verified-direct\npage=%s\ncdn=%s\ncommit=%s\n' "$page" "$cdn" '${{ steps.restore_commit.outputs.sha }}' > verified-direct.txt

      - name: Save direct-file verification
        shell: bash
        run: |
          git add verified-direct.txt
          git commit -m 'Verify direct HTML deployment [skip ci]'
          git push
