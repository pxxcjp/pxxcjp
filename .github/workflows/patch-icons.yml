name: Patch call log icons
on:
  push:
    paths: ['.icon-patch-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch original-style icons
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.lane div{width:92px;display:flex;align-items:center;gap:6px;padding:0 13px;color:#fff;font-size:12px}', '.lane div{width:92px;display:flex;align-items:center;gap:7px;padding:0 13px;color:#fff;font-size:12px}.lane svg{width:22px;height:22px;fill:currentColor;flex:0 0 auto}')
          s=s.replace('.note{font-size:10px;margin-top:1px}', '.note{height:16px;margin-top:2px;display:flex;justify-content:flex-end;align-items:center;color:#a3a3a7}.note svg{width:16px;height:16px;fill:currentColor}')
          marker="const actionIcons={"
          insert="""const laneIcons={call:'<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M11.6883 7.8927 13.4618 10.8278c.2285.3783.2282.8374-.0009 1.1794l-1.2722 1.5465c-.2469.3689-.2261.8704.052 1.2591.5812.809 1.37 1.7329 2.3662 2.7716 1.0407.9952 1.9658 1.7827 2.7759 2.363.3893.2776.8916.2984 1.261.0518l1.5488-1.2703c.3425-.2287.8023-.229 1.1811-.0008l2.8462 1.7147c1.2389.7464 1.6382 2.3558.8918 3.5948-.0643.1067-.1361.2087-.2149.3051-1.1502 1.4083-3.5719 1.6739-5.4076.7915-.8371-.4319-1.3939-.7311-1.6704-.8978-1.8055-1.0879-3.8704-2.739-5.518-4.3963-1.6433-1.6365-3.2762-3.6766-4.3555-5.4626-.1669-.2761-.4666-.8321-.8991-1.6679-.8837-1.8331-.6948-4.0771.7926-5.3997 1.045-.9291 2.6454-.8352 3.5746.2098.1028.1157.1948.2405.2749.373z\"></path></svg>',msg:'<svg viewBox=\"0 0 32 32\" aria-hidden=\"true\"><path d=\"M16 7c2.7661 0 5.2406.3035 6.8915 1.7988C24.2074 9.9906 25 11.9392 25 15.0944c0 3.1553-.7927 5.104-2.1087 6.2958-1.6509 1.495-4.1254 1.7987-6.8913 1.7987-.8431 0-1.6592-.0282-2.4331-.1098-1.1051 1.0484-2.2392 1.6815-3.4012 1.8996-.3677.0691-.5526-.0285-.3411-.3133.1982-.267.4954-.7011.6006-1.3249.0724-.4299.0378-.8052-.104-1.1259-.4421-.2214-.8475-.4937-1.2126-.8244C7.7927 20.1984 7 18.2497 7 15.0944c0-3.1552.7926-5.104 2.1084-6.2956C10.7592 7.3035 13.2338 7 16 7z\"></path></svg>'};
          const rowIcons={mic:'<svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M10.79 13.133a.5.5 0 0 1 0 1H5.205a.5.5 0 0 1 0-1zm1.229-6.339a.5.5 0 0 1 .5.5 4.519 4.519 0 1 1-9.039 0 .5.5 0 0 1 1 0 3.519 3.519 0 1 0 7.039 0 .5.5 0 0 1 .5-.5M8.267 1.893A1.933 1.933 0 0 1 10.2 3.827v3.466a2.2 2.2 0 0 1-4.4 0V3.827a1.933 1.933 0 0 1 1.933-1.934z\"></path></svg>',ai:'<svg viewBox=\"0 0 17 17\" aria-hidden=\"true\"><path d=\"M4.015 3.047a1.6 1.6 0 0 1 1.189.645l1.198 1.971a.7.7 0 0 1 0 .742l-.801.974a.7.7 0 0 0 .032.792c.366.51.864 1.092 1.491 1.746.655.627 1.237 1.125 1.748 1.488a.7.7 0 0 0 .794.033l.975-.8a.7.7 0 0 1 .744-.001l1.792 1.08a1.59 1.59 0 0 1 .426 2.457c-.747.912-2.252 1.041-3.405.498-.527-.272-.878-.461-1.052-.566a17.8 17.8 0 0 1-3.473-2.768A17.6 17.6 0 0 1 2.928 7.898c-.105-.174-.293-.524-.565-1.051-.539-1.118-.445-2.479.413-3.32.345-.338.792-.503 1.239-.48m6.893-.957c.294 0 .532.238.532.531v5.383a.532.532 0 0 1-1.063 0V2.621c0-.293.238-.531.531-.531m1.629 1.416c.294 0 .532.238.532.532v2.549a.532.532 0 0 1-1.063 0V4.038c0-.294.238-.532.531-.532m1.629.851c.294 0 .532.237.532.531v.85a.532.532 0 0 1-1.063 0v-.85c0-.294.238-.531.531-.531\"></path></svg>'};
          const recordedNames=new Set(['北岸物流','林川','沈知遥','陆宁']);
          const rowNote=x=>x[5].includes('智能语音回复')?`<div class=\"note\" aria-label=\"智能语音回复\">${rowIcons.ai}</div>`:recordedNames.has(x[1])?`<div class=\"note\" aria-label=\"有通话录音\">${rowIcons.mic}</div>`:'';
          """
          if 'const laneIcons=' not in s:
              s=s.replace(marker, insert+marker)
          s=s.replace('<div class="call">☎ 呼叫</div><div class="msg">信息 ✉</div>', '<div class="call">${laneIcons.call}<span>呼叫</span></div><div class="msg"><span>信息</span>${laneIcons.msg}</div>')
          s=s.replace("${x[5].includes('通话')?'<div class=\"note\">● 录音/详情</div>':''}", "${rowNote(x)}")
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Use original-style swipe and call-state icons' || exit 0
          git push